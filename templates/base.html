<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}AnnDesign — Wiki{% endblock %}</title>
<style>
  :root{
    --ivory:#FBF8F3; --ink:#1B1512; --ink-soft:#55493d;
    --gold:#B4903F; --gold-deep:#8C6A2F; --rose:#F1DBDF; --rose-line:#E3BEC5;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--ivory); color:var(--ink); font-family:"Times New Roman", Times, serif; }
  nav{ display:flex; gap:24px; padding:20px 30px; border-bottom:1px solid var(--rose-line); align-items:center; }
  nav .brand{ font-size:1.2rem; letter-spacing:0.06em; margin-right: auto; }
  nav .brand em{ color:var(--gold-deep); font-style:italic; }
  nav a{ color:var(--ink-soft); text-decoration:none; font-size:0.95rem; }
  nav a:hover{ color:var(--gold-deep); }
  main{ max-width:900px; margin:0 auto; padding:36px 24px 60px; }
  h1{ font-weight:400; font-size:1.8rem; margin-bottom: 6px;}
  .sub{ color:var(--ink-soft); font-style:italic; margin-top:0; margin-bottom: 30px;}
  table{ width:100%; border-collapse:collapse; margin-bottom:24px;}
  th{ text-align:left; font-style:italic; font-weight:400; color:var(--ink-soft); border-bottom:1px solid var(--gold); padding:0 10px 8px 0; font-size:0.85rem;}
  td{ padding:10px 10px 10px 0; border-bottom:1px solid var(--rose-line); font-size:0.92rem;}
  input, textarea, select{ width:100%; font-family:inherit; padding:8px; border:1px solid var(--rose-line); background:var(--ivory); color:var(--ink); margin-bottom:12px;}
  label{ display:block; font-size:0.82rem; font-style:italic; color:var(--ink-soft); margin-bottom:4px;}
  button{ background:var(--gold); color:var(--ivory); border:none; padding:10px 20px; font-family:inherit; cursor:pointer;}
  button:hover{ background:var(--gold-deep); }
  .card{ border:1px solid var(--rose-line); padding:20px; margin-bottom:16px;}
  .badge{ font-size:0.75rem; font-style:italic; color:var(--gold-deep); border:1px solid var(--gold); padding:2px 10px; border-radius:12px;}
</style>
</head>
<body>

<nav>
 <!-- CORRECCIÓN DE RUTAS DEL MENÚ EN base.html -->
<div class="sidebar" id="sidebar">
    <h2>AnnDesign Wiki</h2>
    <!-- Apunta a la plantilla del Dashboard -->
    <a href="/templates/dashboard.html">📊 Dashboard</a>
    
    <!-- Apunta al panel visual HTML, NO a /proyectos a secas -->
    <a href="/templates/proyectos/panel">📁 Mis Proyectos</a>
    
    <!-- Apunta al formulario visual del Generador -->
    <a href="/templates/generador.html">✨ Generador de Slides</a>
    
    <!-- Apunta a la sección de marca -->
    <a href="/empresa/panel">🎨 Identidad de Marca</a>
    
    <form action="/logout" method="POST" class="logout-form">
        <button type="submit" class="logout-btn">🚪 Cerrar Sesión</button>
    </form>
</div>

</nav>

<main>
  {% block content %}{% endblock %}
</main>

</body>
</html>
