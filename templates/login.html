<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Wiki AnnDesign</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        /* Estilos rápidos de marca (puedes moverlos a static/styles.css luego) */
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #FBF8F3; /* Ivory */
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }
        h2 { color: #B4903F; margin-bottom: 24px; } /* Gold */
        .form-group { text-align: left; margin-bottom: 16px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            background-color: #B4903F;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:hover { background-color: #967631; }
        .error-msg { color: #d9534f; font-size: 14px; margin-top: 12px; display: none; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>AnnDesign Wiki</h2>
    <!-- El formulario envía los datos directamente a nuestro endpoint POST /login -->
        <!-- Si el backend envía la variable 'error', Jinja2 pintará esta alerta en pantalla -->
    {% if error %}
    <div style="background-color: #f8d7da; color: #721c24; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; text-align: left;">
        {{ error }}
    </div>
    {% endif %}

    <form action="/login" method="POST">
        <div class="form-group">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" required placeholder="Tu usuario">
        </div>
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required placeholder="••••••••">
        </div>
        <button type="submit">Ingresar</button>
    </form>
</div>

</body>
</html>
