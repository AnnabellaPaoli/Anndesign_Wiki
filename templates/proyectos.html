{% extends "base.html" %}
{% block content %}
<h2>📁 Gestión de Proyectos</h2>
<div style="display: grid; grid-template-columns: 2fr 1fr; gap: 30px;">
    <div class="card-panel">
        <h3>Lista General</h3>
        <table>
            <thead><tr><th>Proyecto</th><th>Cliente</th><th>Estado</th><th>Acciones</th></tr></thead>
            <tbody>
                {% for p in proyectos %}
                <tr>
                    <td><strong>{{ p.nombre_proyecto }}</strong></td>
                    <td>{{ p.cliente or 'S/A' }}</td>
                    <td>{{ p.estado }}</td>
                    <td>
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <a href="/proyectos/ver/{{ p.id }}" style="color: var(--gold); font-weight: bold; text-decoration: none;">Ver Histórico</a>
                            
                            <!-- Formulario en línea para borrar de inmediato -->
                            <form action="/proyectos/{{ p.id }}/borrar" method="POST" onsubmit="return confirm('¿Seguro que deseas eliminar este proyecto y todo su histórico de tareas?');" style="margin: 0;">
                                <button type="submit" style="background: none; border: none; color: #d9534f; cursor: pointer; font-weight: bold; font-size: 13px; padding: 0;">[Eliminar]</button>
                            </form>
                        </div>
                    </td>
                </tr>
                {% else %}
                <tr><td colspan="4">No hay proyectos.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <div class="card-panel">
        <h3>Nuevo Cliente</h3>
        <form action="/proyectos/panel/crear" method="POST">
            <div class="form-group"><label>Nombre</label><input type="text" name="nombre_proyecto" required></div>
            <div class="form-group"><label>Cliente</label><input type="text" name="cliente"></div>
            <div class="form-group"><label>Estado</label><select name="estado"><option>en conversación</option><option>en diseño</option><option>en desarrollo</option></select></div>
            <div class="form-group"><label>Notas</label><textarea name="notas"></textarea></div>
            <button type="submit" class="btn-gold" style="width:100%;">Guardar</button>
        </form>
    </div>
</div>
{% endblock %}
