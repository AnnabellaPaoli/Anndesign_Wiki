{% extends "base.html" %}
{% block title %}Dashboard — AnnDesign{% endblock %}
{% block content %}
<h2>Panel de Control</h2>
<p>Bienvenida de vuelta, {{ usuario }} ✨</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px;">
    <div class="card-panel" style="text-align: center;">
        <h3>Proyectos Activos</h3>
        <div style="font-size: 40px; font-weight: bold; color: var(--gold);">{{ proyectos_count }}</div>
    </div>
    <div class="card-panel" style="text-align: center;">
        <h3>Piezas de Contenido</h3>
        <div style="font-size: 40px; font-weight: bold; color: var(--gold);">{{ contenido_count }}</div>
    </div>
</div>
{% endblock %}
